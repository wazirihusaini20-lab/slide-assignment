<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <h1>WELCOME TO MY GALLERY</h1>
    </header>

    <main class="gallery-container">
        
        <div class="gallery-item item-large-square">
            <img src="images-1.jpg" alt="image 1">
        </div>
        
        <div class="gallery-item item-tall">
            <img src="images-2.jpg" alt="image 2">
        </div>

        <div class="gallery-item item-small">
            <img src="images-3.jpg" alt="image 3">
        </div>
        
        <div class="gallery-item item-wide">
            <img src="images-4.jpg" alt="image 4">
        </div>
        
        <div class="gallery-item item-massive">
            <img src="images-5.jpg" alt="image 5">
        </div>

        </main>
    <footer class="site-footer">
        <h2>BYE BYE</h2>
    </footer>

</body>
</html>
